{% extends "templates/web.html" %}

{% block title %}{{ _("Loading demo") }}{% endblock %}

{% block head_include %}
<meta name="robots" content="noindex,nofollow">
{% endblock %}

{% block page_content %}
<!-- Rendered only when the server-side auto-login could not run (it normally
     redirects before this template is reached) — a branded splash with a manual
     path into the demo. Slate-teal palette only (no superseded cyan). -->
<div style="position:fixed;inset:0;z-index:99999;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#1C2B30,#2E5562 60%,#557E94);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center">
  <div style="padding:32px">
    <div style="width:54px;height:54px;border:5px solid rgba(255,255,255,.25);border-top-color:#9DBEC8;border-radius:50%;margin:0 auto 22px;animation:nxspin 1s linear infinite"></div>
    <h1 style="font-size:1.35rem;font-weight:600;margin:0 0 8px">Setting up your live demo…</h1>
    <p style="opacity:.8;margin:0;font-size:.95rem">One moment — signing you in.</p>
    <p style="margin-top:18px;font-size:.8rem;opacity:.6">Trouble loading? <a style="color:#9DBEC8" href="/login">Open the demo manually</a>.</p>
  </div>
</div>
<style>@keyframes nxspin{to{transform:rotate(360deg)}}</style>
<script>setTimeout(function () { window.location.replace("/app"); }, 2500);</script>
{% endblock %}
